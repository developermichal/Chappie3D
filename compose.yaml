name: chappie3d

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chappie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chappie_secret}
      POSTGRES_DB: ${POSTGRES_DB:-chappie_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_PATH:-./service-data/postgres}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chappie} -d ${POSTGRES_DB:-chappie_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - type: bind
        source: ${REDIS_DATA_PATH:-./service-data/redis}
        target: /data
        bind:
          create_host_path: false
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  model:
    profiles: [inference]
    build:
      context: .
      dockerfile: docker/model.Dockerfile
    command:
      - --model
      - /models/chappie.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${MODEL_CTX_SIZE:-32768}
      - --n-gpu-layers
      - all
      - --split-mode
      - layer
      - --parallel
      - "1"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ${MODEL_GGUF_PATH:-C:/development/chappie/model/Qwen3-Coder-30B-A3B-Instruct-Heretic.Q8_0.gguf}
        target: /models/chappie.gguf
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=1g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  chroma:
    profiles: [inference]
    image: chromadb/chroma:1.5.9
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        # Do not run another Chroma server against this SQLite directory at the same time.
        source: ${CHROMA_DATA_PATH:-W:/chroma_data}
        target: /data
        bind:
          create_host_path: false
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ \"$$status\" == *' 200 '* ]] "]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  embedder:
    profiles: [inference]
    build:
      context: .
      dockerfile: docker/embedder.Dockerfile
    environment:
      EMBEDDING_DEVICE: cuda
    ports:
      - "127.0.0.1:8090:8090"
    read_only: true
    tmpfs:
      - /tmp:size=2g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=4))['status'] == 'ok'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  workspace:
    build:
      context: .
      dockerfile: src/services/workspace/Dockerfile
    environment:
      WORKSPACE_DATABASE_URL: ${WORKSPACE_DATABASE_URL:-sqlite:////app/data/workspace.db}
      WORKSPACE_SERVICE_PORT: 8001
      WORKSPACE_ENABLED: "true"
    ports:
      - "${WORKSPACE_PORT:-8005}:8001"
    volumes:
      - ./data:/app/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: src/services/backend/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chappie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chappie_secret}
      POSTGRES_DB: ${POSTGRES_DB:-chappie_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://chappie:chappie_secret@db:5432/chappie_db}
      SECRET_KEY: ${SECRET_KEY:-chappie3d_engineering_secret_key_production_2026}
      SESSION_EXPIRY_HOURS: ${SESSION_EXPIRY_HOURS:-12}
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL:-http://host.docker.internal:8003}
      BACKEND_PORT: 8002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8004}:8002"
    volumes:
      - ./data:/app/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/api/backend/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "${UI_PORT:-3001}:80"
    depends_on:
      - backend
    networks: [backend]
    restart: unless-stopped

networks:
  backend:
    driver: bridge
